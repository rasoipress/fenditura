name: Prove

# Solo le prove del nucleo. Il bundle non viene costruito qui: un'app non
# firmata compilata su un runner non serve a nessuno, e chi la vuole se la
# compila in locale con ./build.sh, dove Gatekeeper non entra in gioco.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: swift test
    runs-on: macos-15
    steps:
      - name: Preleva il codice
        uses: actions/checkout@v5

      - name: Versione di Swift
        run: swift --version

      - name: Prove del nucleo
        run: swift test

      - name: Compilazione dell'eseguibile
        # Le prove non toccano SwiftUI né AVFoundation: questo passo verifica
        # che anche la parte grafica compili.
        run: swift build -c release
